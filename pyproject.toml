[project]
name = "medcompliance_agent"
version = "0.1.0"
description = "A simple RAG + agent prototype for regulatory text."
readme = "README.md"

authors = [
    { name = "Boran Gündoğan", email = "75067510+borangundogan@users.noreply.github.com" }
]

requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.123.8",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.4",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "sentence-transformers>=5.1.2",
    "streamlit>=1.52.0",
    "uvicorn>=0.38.0",
]

# Entry point for `uv run medcompliance`
[project.scripts]
medcompliance = "medcompliance_agent.main:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
